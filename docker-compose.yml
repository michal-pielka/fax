# One door: Caddy on 80/443, routing / to the site, /api/* to the gateway and
# /mqtt to the broker. Nothing else publishes a port, so /internal/* is safe.

name: fax

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # json-file never rotates by default, and a full disk takes Caddy down
    # with everything else. 30 MB per service is months of history here.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      # The only ports open to the internet. 80 exists so Caddy can answer
      # the ACME challenge and redirect; everything real is on 443.
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "fax.pielka.sh"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/web:ro
      - caddy-data:/data
    depends_on: [gateway]

  gateway:
    build:
      context: ./backend
      dockerfile: cmd/gateway/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command:
      - "-addr=:8080"
      - "-renderer=http://renderer:8081"
      - "-dispatcher=http://dispatcher:8082"
      - "-photos-dir=/var/lib/fax/photos"
    # A copy of every printed photo, the way printed text is in the logs.
    # Not rotated: a square photo is under 20 KB, so a full volume is months
    # of strangers away, and it is the only record of what came out.
    volumes:
      - photos:/var/lib/fax/photos
    depends_on: [renderer, dispatcher]

  renderer:
    build:
      context: ./backend
      dockerfile: cmd/renderer/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  dispatcher:
    build:
      context: ./backend
      dockerfile: cmd/dispatcher/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command:
      - "-addr=:8082"
      - "-broker=tcp://mosquitto:1883"
      - "-username=${MQTT_USERNAME:-backend}"
      - "-device=${DEVICE_ID:-printer-1}"
    environment:
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}"
    # depends_on orders starts, not readiness. The restart policy is what
    # covers the second before mosquitto is listening.
    depends_on: [mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # No published ports: 1883 for the dispatcher and 9001 for Caddy are
    # reachable only from inside this network.
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

volumes:
  caddy-data:
  mosquitto-data:
  photos:
