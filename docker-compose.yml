# One door into the whole stack: Caddy on 80/443.
#
#   /        the site
#   /api/*   the gateway
#   /mqtt    the broker, over websockets
#
# Nothing else publishes a port. The gateway, renderer, dispatcher and
# mosquitto talk over the internal compose network and are unreachable from
# outside -- which is what makes the /internal/* paths safe to leave
# unauthenticated, and what keeps TLS entirely Caddy's problem.

name: fax

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # The only ports open to the internet. 80 exists so Caddy can answer
      # the ACME challenge and redirect; everything real is on 443.
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "fax.pielka.sh"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
    depends_on: [gateway]

  gateway:
    build:
      context: ./backend
      dockerfile: cmd/gateway/Dockerfile
    restart: unless-stopped
    command:
      - "-addr=:8080"
      - "-renderer=http://renderer:8081"
      - "-dispatcher=http://dispatcher:8082"
    depends_on: [renderer, dispatcher]

  renderer:
    build:
      context: ./backend
      dockerfile: cmd/renderer/Dockerfile
    restart: unless-stopped

  dispatcher:
    build:
      context: ./backend
      dockerfile: cmd/dispatcher/Dockerfile
    restart: unless-stopped
    command:
      - "-addr=:8082"
      - "-broker=tcp://mosquitto:1883"
      - "-username=${MQTT_USERNAME:-backend}"
      - "-device=${DEVICE_ID:-printer-1}"
    environment:
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}"
    # The dispatcher exits if it cannot reach the broker at startup, which is
    # deliberate -- it has no purpose without one. depends_on only orders
    # container starts, not readiness, so the restart policy is what actually
    # covers the second or two before mosquitto is listening.
    depends_on: [mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # No published ports, deliberately. Both listeners are reachable only
    # from inside this network: 1883 for the dispatcher, 9001 for Caddy.
    # The broker has no door of its own onto the internet.
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

volumes:
  caddy-data:
  mosquitto-data:
