<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAX - every print</title>
<meta name="description" content="Every message ever printed on the FAX receipt printer, laid out on one wall. Drag to move, click a receipt to read it.">
<link rel="canonical" href="https://fax.pielka.sh/prints">
<meta property="og:type" content="website">
<meta property="og:title" content="FAX - every print">
<meta property="og:description" content="Every message ever printed on the FAX receipt printer, laid out on one wall.">
<meta property="og:url" content="https://fax.pielka.sh/prints">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3 1h10v14l-2-1-1.5 1L8 14l-1.5 1L5 14l-2 1z' fill='%23ffffff' stroke='%232a2724'/%3E%3Cpath d='M5 4h6M5 6.5h6M5 9h4' stroke='%232a2724' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/prints.css">
</head>
<body class="wall-page">

<header class="wall-bar">
  <a href="/">FAX</a>
  <span id="count"></span>
  <a href="/">PRINT YOURS</a>
</header>

<!-- Every print ever, laid out as one table of receipts. Drag to move,
     scroll or pinch to zoom, click one to read it. -->
<div class="viewport" id="viewport" tabindex="0"
     aria-label="Every print. Drag to move, scroll or pinch to zoom, click a receipt to open it.">
  <canvas class="wall-canvas" id="wall" aria-hidden="true"></canvas>
</div>

<button class="wall-new" id="fresh" hidden>NEW PRINT</button>
<div class="status" id="status" role="status" aria-live="polite"></div>

<!-- The full-size receipt in the dialog. Must match the one in index.html,
     which matches what prints; js/tile.js draws the wall's to the same plan. -->
<template id="receipt">
  <div class="roll">
    <div class="paper">
      <div class="zone fixed">
        <div class="big">FAX</div>
        <div>THE SLOWEST SOCIAL NETWORK</div>
      </div>
      <div class="divider"></div>
      <div class="zone body"><pre class="mirror"></pre></div>
      <div class="divider"></div>
      <div class="zone fixed">
        <div>COMMITTED TO PHYSICAL MEDIA</div>
        <div>*** fax.pielka.sh ***</div>
      </div>
    </div>
  </div>
</template>

<!-- One print, full size, on the same table as the help receipt. -->
<dialog class="about detail" id="detail" aria-label="A print">
  <div class="sheet" id="detailSheet"></div>
  <p class="detail-meta" id="detailMeta"></p>
  <button class="help back" id="detailBack" aria-label="Back">&lt;</button>
</dialog>

<script type="module" src="/prints.js"></script>
</body>
</html>
