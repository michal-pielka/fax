<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAX</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stack">

  <div class="roll" id="roll">
    <div class="paper">
    <!-- Must match the frame in backend/internal/render/render.go. The point
         of the preview is that it looks like what comes out. -->
    <div class="zone fixed">
      <div class="big">FAX</div>
      <div>THE SLOWEST SOCIAL NETWORK</div>
    </div>
    <div class="divider" id="divTop"></div>

    <!-- The textarea is the text; the mirror behind it is the same text with
         bold and underline applied. Both wrap where the printer wraps. -->
    <div class="zone body" id="body">
      <pre class="mirror" id="mirror" aria-hidden="true"></pre>
      <textarea id="text" spellcheck="false" autocorrect="off" autocapitalize="off"
                autocomplete="off" aria-label="Your message" placeholder="start typing"></textarea>
    </div>

    <div class="divider" id="divBot"></div>
    <div class="zone fixed">
      <div>COMMITTED TO PHYSICAL MEDIA</div>
      <div>*** fax.pielka.sh ***</div>
    </div>
  </div>
</div>

  <!-- The front panel, under the paper it changes. With text selected a key
       styles it; with a bare caret it sets what typing produces, and stays
       lit until pressed again. Shown while the paper is being written on. -->
  <div class="keys" id="keys" role="toolbar" aria-label="Formatting"></div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

</div>

<div class="bar">
  <button id="print" class="print">PRINT</button>
</div>

<script src="app.js"></script>
</body>
</html>
