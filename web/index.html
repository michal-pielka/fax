<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAX</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stack">

  <div class="roll" id="roll">
    <div class="paper">
    <!-- Must match the frame in backend/internal/render/render.go. The point
         of the preview is that it looks like what comes out. -->
    <div class="zone fixed">
      <div class="big">FAX</div>
      <div>THE SLOWEST SOCIAL NETWORK</div>
    </div>
    <div class="divider" id="divTop"></div>

    <div class="zone body" id="body" contenteditable="true"
         spellcheck="false" autocorrect="off" autocapitalize="off"
         aria-label="Your message"></div>

    <div class="divider" id="divBot"></div>
    <div class="zone fixed">
      <div>COMMITTED TO PHYSICAL MEDIA</div>
      <div>*** fax.pielka.sh ***</div>
    </div>
  </div>
</div>

  <!-- The printer's front panel, directly under the paper it describes. Fed by
       /api/events, so it is what is true right now rather than what was true
       when the page loaded. -->
  <div class="lamps" id="lamps" role="status" aria-live="polite">
    <span class="lamp" id="lampOnline">ONLINE</span>
    <span class="lamp" id="lampPaper">PAPER</span>
    <span class="lamp" id="lampBusy">BUSY</span>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

</div>

<div class="bar">
  <button id="print" class="print">Print</button>
</div>

<div class="pop" id="tools" role="toolbar" aria-label="Formatting"></div>

<script src="app.js"></script>
</body>
</html>
