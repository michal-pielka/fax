# Two listeners, neither reachable from outside the compose network.
#
# Nothing here does TLS. Caddy terminates it at :443 and proxies the websocket
# in over the internal network, which is what keeps certificates entirely Caddy's problem

# For the dispatcher, container to container. Plain TCP is fine: this never
# leaves the Docker network.
listener 1883

# For the ESP32, via Caddy. Websockets because Caddy is an HTTP proxy and
# cannot route plain MQTT -- putting MQTT over HTTP is what lets the whole
# stack sit behind one port.
listener 9001
protocol websockets

# No anonymous access even on an internal network.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Caps, so a flood is refused rather than eating the box. Receipts are well
# under a kilobyte; 8 KiB is generous.
max_connections 50
max_packet_size 8192
max_queued_messages 100

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
