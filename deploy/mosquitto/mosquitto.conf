listener 1883

# No anonymous access even on a tailnet. The credentials are what stop a
# compromised device from publishing jobs, and that matters regardless of who
# can reach the port.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
